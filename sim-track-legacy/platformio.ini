; PlatformIO Configuration for ESP32-C3 Super Mini + SIM800L
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3_tracker
src_dir = src

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.mcu = esp32c3
monitor_filters = esp32_exception_decoder, default

; Environment 1: Main SIM800 Tracker Firmware
[env:esp32c3_tracker]
build_src_filter = +<main.cpp> +<config.h> +<SIM800C_Cellular.h> +<CellTriangulation.h>

; Environment 2: GPRS Internet Connectivity Tester
[env:esp32c3_internet_test]
build_src_filter = +<test_internet.cpp> +<config.h>
